name: Renovate

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      repositories:
        description: 'Targeted run: comma-separated owner/repo list (blank = full allowlist)'
        required: false
        type: string
  repository_dispatch:
    types: [renovate]

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        owner: [webdev-harke, routivo, loc-news, lkshrk]
    env:
      TARGET: ${{ github.event.inputs.repositories || github.event.client_payload.repositories || '' }}
    # One pending run per owner and target: bursts of identical dispatches collapse into the latest.
    concurrency:
      group: renovate-${{ matrix.owner }}-${{ github.event.inputs.repositories || github.event.client_payload.repositories || 'all' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        if: env.TARGET == '' || contains(format(',{0}', env.TARGET), format(',{0}/', matrix.owner))
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ matrix.owner }}

      - uses: renovatebot/github-action@43b963bf5dd5e57f1f95c59765a018d782870211 # v46.3.11
        if: steps.app-token.outcome == 'success'
        with:
          configurationFile: renovate/config.js
          token: ${{ steps.app-token.outputs.token }}
          env-regex: '^(?:RENOVATE_\w+|LOG_LEVEL|GITHUB_COM_TOKEN|NODE_OPTIONS|DOCKERHUB_\w+|GHCR_\w+)$'
        env:
          RENOVATE_REPOSITORY_OWNER: ${{ matrix.owner }}
          RENOVATE_REPO_FILTER: ${{ env.TARGET }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PASSWORD: ${{ secrets.GHCR_TOKEN }}
          LOG_LEVEL: info
