name: Build pr-dashboard image

on:
  push:
    branches: [main]
    paths:
      - 'pr-dashboard/**'
      - '.github/workflows/pr-dashboard-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: pr-dashboard-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - run: bun test pr-dashboard/

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        id: image
        with:
          context: .
          file: pr-dashboard/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/lkshrk/gh-ops/pr-dashboard:latest
            ghcr.io/lkshrk/gh-ops/pr-dashboard:${{ github.sha }}

      - name: Create h-cloud deployment token
        if: github.ref == 'refs/heads/main'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: deploy-token
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: lkshrk
          repositories: h-cloud
          permission-contents: write

      - name: Deploy published image through h-cloud
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ steps.deploy-token.outputs.token }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          jq -n --arg tag "latest@${IMAGE_DIGEST}" \
            '{event_type: "image-update", client_payload: {app: "pr-dashboard", image: "ghcr.io/lkshrk/gh-ops/pr-dashboard", tag: $tag}}' \
            | gh api --method POST repos/lkshrk/h-cloud/dispatches --input -
