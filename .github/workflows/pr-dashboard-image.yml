name: Build pr-dashboard image

on:
  push:
    branches: [main]
    paths:
      - 'pr-dashboard/**'
      - '.github/workflows/pr-dashboard-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun test pr-dashboard/

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: pr-dashboard/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/lkshrk/gh-ops/pr-dashboard:latest
            ghcr.io/lkshrk/gh-ops/pr-dashboard:${{ github.sha }}
