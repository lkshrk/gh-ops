name: Build bridge image

on:
  push:
    branches: [main]
    paths:
      - 'renovate-trigger-bridge/**'
      - '.github/workflows/bridge-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        id: image
        with:
          context: .
          file: renovate-trigger-bridge/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/lkshrk/gh-ops/renovate-trigger-bridge:latest
            ghcr.io/lkshrk/gh-ops/renovate-trigger-bridge:${{ github.sha }}

      - name: Create h-cloud deployment token
        if: github.ref == 'refs/heads/main'
        uses: actions/create-github-app-token@v3
        id: deploy-token
        with:
          client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: lkshrk
          repositories: h-cloud
          permission-contents: write

      - name: Deploy published image through h-cloud
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ steps.deploy-token.outputs.token }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          jq -n --arg tag "latest@${IMAGE_DIGEST}" \
            '{event_type: "image-update", client_payload: {app: "renovate-trigger-bridge", image: "ghcr.io/lkshrk/gh-ops/renovate-trigger-bridge", tag: $tag}}' \
            | gh api --method POST repos/lkshrk/h-cloud/dispatches --input -
