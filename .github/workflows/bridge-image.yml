name: Build bridge image

on:
  push:
    branches: [main]
    paths:
      - 'renovate-trigger-bridge/**'
      - '.github/workflows/bridge-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: renovate-trigger-bridge/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/lkshrk/gh-ops/renovate-trigger-bridge:latest
            ghcr.io/lkshrk/gh-ops/renovate-trigger-bridge:${{ github.sha }}
